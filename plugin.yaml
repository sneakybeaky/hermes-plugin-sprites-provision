name: sprites
version: 1.1.0
description: Sprites terminal backend with checkpoint & restore, tagging, and first-creation provisioning
author: Kyle McLaren (@kylemclaren) / Nous Research
kind: backend
requires_env:
  - SPRITES_TOKEN
python_deps:
  - spec: sprites-py>=0.7.0,<0.8
    install_hint: |
      The Hermes venv is root-owned and read-only. Install with:
        uv pip install --python /opt/hermes/.venv/bin/python3 \
          --target /opt/data/.hermes/python-packages \
          --no-deps 'sprites-py>=0.7.0,<0.8'
      Then add to /opt/data/.env:
        PYTHONPATH=/opt/data/.hermes/python-packages:/opt/data/plugins/sprites
post_install: |
  1. Install sprites-py SDK (see python_deps above).
  2. Set PYTHONPATH in /opt/data/.env to include the python-packages dir
     and the plugin dir.
  3. Set SPRITES_TOKEN in /opt/data/.env (get one at sprites.dev/account).
  4. Run: hermes config set terminal.backend sprites
  5. Optional: configure terminal.sprites.* in config.yaml for tags/provisioning.
  6. Start a new session for changes to take effect.